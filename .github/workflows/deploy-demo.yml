name: Deploy Demo & Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - runtime-v2
    paths:
      - "packages/demo/**"
      - "packages/core/src/**"
      - "packages/react/src/**"
      - "apps/dashboard/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: apps/dashboard

      - name: Build packages
        run: |
          npm run build --workspace=@prismui/core
          npm run build --workspace=@prismui/react

      - name: Build demo
        run: npm run build --workspace=@prismui/demo

      - name: Build dashboard
        run: npm run build
        working-directory: apps/dashboard

      - name: Merge artifacts
        run: |
          mkdir -p _site
          cp -r packages/demo/dist/* _site/
          mkdir -p _site/dashboard
          cp -r apps/dashboard/dist/* _site/dashboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
